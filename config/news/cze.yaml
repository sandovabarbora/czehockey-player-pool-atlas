# "This autumn" (report section #autumn): dated news beside the atlas's
# frozen data. The atlas data is NOT refreshed for it -- every number the
# section shows is read from outputs/ (pool.json, q5_abroad.json), and only
# the dated facts below come from outside.
#
# Only facts graded "confirmed by an official source" or "confirmed by
# reputable media only" in the news review of 29 September 2026 are here.
# Left out as "not confirmed": any national-team captaincy (no announcement
# found; Pastrňák was an alternate captain at the 2026 Olympics) and the
# 2026-27 Czech Hockey Games venues and dates.
# A source is cited only if it was read; `date` is its publication date where
# the page shows one (checked 29 September 2026), null otherwise (rendered "n.d.").
# `author` and `title` are as the page gives them.
#
# Wording rules: no evaluation of the appointments or the players; the
# Pastrňák item is a club (NHL) captaincy and must not read as the national
# team's.
#
# The section is left out when this file is missing (src.web.context._autumn).

